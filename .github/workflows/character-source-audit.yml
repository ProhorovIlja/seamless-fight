name: Candidate CC0 character atlas audit
on:
  workflow_dispatch:
  push:
    branches:
      - feat/lantern-court
    paths:
      - .github/workflows/character-source-audit.yml
permissions:
  contents: read
jobs:
  cc0-knight-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare read-only inspector
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Fetch author CC0 sprite source (not deploy)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-audit
          printf '%s\n' 'Source: https://opengameart.org/content/dark-knight-2d-character-sprites' > source-audit/SOURCE.txt
          printf '%s\n' 'License claim: CC0, by author comphonia. Verify source and actual package content before import.' >> source-audit/SOURCE.txt
          curl --fail --location --show-error --silent --retry 2 --max-time 120 \
            'https://opengameart.org/sites/default/files/Knight%202D.zip' \
            --output "${RUNNER_TEMP}/knight-cc0-source.zip"
          file "${RUNNER_TEMP}/knight-cc0-source.zip"
          python scripts/audit-character-source.py "${RUNNER_TEMP}/knight-cc0-source.zip" source-audit
      - name: Upload inspection-only atlas thumbnails and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-cc0-knight-visual-audit
          path: source-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Report boundaries
        if: always()
        run: |
          echo '### CC0 candidate audit — no game asset was shipped' >> "${GITHUB_STEP_SUMMARY}"
          echo 'This job downloads the author pack only into a temporary CI worker and exports a contact sheet/manifest for art-direction and legal checks.' >> "${GITHUB_STEP_SUMMARY}"
          echo 'Source: https://opengameart.org/content/dark-knight-2d-character-sprites' >> "${GITHUB_STEP_SUMMARY}"
