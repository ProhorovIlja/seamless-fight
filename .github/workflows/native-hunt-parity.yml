name: Native Hunt v3 C++17 vs JS frame parity
on:
  push:
    branches: [feat/lantern-court]
    paths:
      - 'native/combat/hunt_core.*'
      - 'native/combat/hunt_state_codec*'
      - 'scripts/native-hunt-parity.mjs'
      - 'public/side-hunt-lab.mjs'
      - '.github/workflows/native-hunt-parity.yml'
  pull_request:
    paths:
      - 'native/combat/hunt_core.*'
      - 'native/combat/hunt_state_codec*'
      - 'scripts/native-hunt-parity.mjs'
      - 'public/side-hunt-lab.mjs'
      - '.github/workflows/native-hunt-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-hunt-v3:
    name: Linux GCC / Hunt v3 exact rules parity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/native-hunt-parity.mjs
      - name: Strict no-exception canonical native Hunt v3 checkpoint integrity tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fno-exceptions -ffp-contract=off -fno-fast-math native/combat/hunt_state_codec_test.cpp -o "$RUNNER_TEMP/hunt-codec"
          "$RUNNER_TEMP/hunt-codec"
      - run: echo 'Isolated native Hunt v3; legacy Godot & online remain unchanged' >> "$GITHUB_STEP_SUMMARY"
  windows-hunt-v3:
    name: Windows MSVC / Hunt v3 exact rules parity
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile native x64 and compare exact JS Hunt state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cl /nologo /std:c++17 /O2 /fp:precise /W4 /WX /EHsc /Fe:sf-hunt-v3-native.exe native/combat/hunt_core.cpp
          if ($LASTEXITCODE -ne 0) {throw 'MSVC Hunt v3 build failed'}
          $env:SF_HUNT_NATIVE_CORE_EXE=Join-Path $pwd 'sf-hunt-v3-native.exe'
          node scripts/native-hunt-parity.mjs
          if ($LASTEXITCODE -ne 0) {throw 'MSVC Hunt v3 parity failed'}
          cl /nologo /std:c++17 /O2 /fp:precise /W4 /WX /EHsc /Fe:sf-hunt-v3-codec.exe native/combat/hunt_state_codec_test.cpp
          if ($LASTEXITCODE -ne 0) {throw 'MSVC Hunt checkpoint codec compilation failed'}
          .\sf-hunt-v3-codec.exe
          if ($LASTEXITCODE -ne 0) {throw 'MSVC Hunt checkpoint corruption test failed'}
          'WINDOWS_MSVC_HUNT_V3_PARITY_AND_CODEC=PASS (standalone)' | Out-File $env:GITHUB_STEP_SUMMARY -Append
