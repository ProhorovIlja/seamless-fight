name: Duel checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Debian 13 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    container:
      image: node:${{ matrix.node }}-trixie
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - name: Verify Debian base
        run: |
          . /etc/os-release
          test "$ID" = debian
          test "${VERSION_ID%%.*}" = 13
          bash -n deploy/debian-13-preflight.sh
          bash deploy/debian-13-preflight.sh --ci
      - run: npm install --ignore-scripts --no-audit
      - run: node --check public/game.mjs
      - run: npm test
  browser:
    name: Debian 13 / Chromium smoke
    runs-on: ubuntu-24.04
    container:
      image: node:22-trixie
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: |
          . /etc/os-release
          test "$ID" = debian
          test "${VERSION_ID%%.*}" = 13
      - run: npm install --ignore-scripts --no-audit --no-save playwright@1.58.2
      - run: npx --no-install playwright install --with-deps chromium
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-debian13-presentation-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
