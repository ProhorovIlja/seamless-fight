name: Godot 4.7.2 2.5D Renderer Spike
on:
  push:
    branches: [feat/lantern-court]
    paths:
      - 'experiments/godot-4.7/**'
      - '.github/workflows/godot-render-spike.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official MIT-licensed stable Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 150 --silent --show-error \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output "${RUNNER_TEMP}/godot.zip"
          unzip -q "${RUNNER_TEMP}/godot.zip" -d "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/Godot_v4.7.2-stable_linux.x86_64"
          "${RUNNER_TEMP}/Godot_v4.7.2-stable_linux.x86_64" --headless --version
      - name: Import and validate full Godot scene
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${RUNNER_TEMP}/Godot_v4.7.2-stable_linux.x86_64"
          "${GODOT}" --headless --path experiments/godot-4.7 --editor --import --quit
          "${GODOT}" --headless --path experiments/godot-4.7 --script res://tests/verify_stage.gd --quit-after 240
      - name: Obtain the matching official WebGL2 export template
        shell: bash
        run: |
          set -euo pipefail
          URL=https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          curl --fail --location --retry 2 --max-time 240 --silent --show-error "$URL" --output "${RUNNER_TEMP}/godot-templates.tpz"
          TARGET="${HOME}/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TARGET"
          unzip -p "${RUNNER_TEMP}/godot-templates.tpz" templates/web_nothreads_release.zip > "$TARGET/web_nothreads_release.zip"
          unzip -p "${RUNNER_TEMP}/godot-templates.tpz" templates/version.txt > "$TARGET/version.txt"
          test -s "$TARGET/web_nothreads_release.zip"
          echo "Validated Godot $(cat "$TARGET/version.txt") WebGL2 export template"
      - name: Build actual browser version of stage experiment
        shell: bash
        run: |
          set -euo pipefail
          GODOT="${RUNNER_TEMP}/Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p artifacts/godot-web
          "${GODOT}" --headless --path experiments/godot-4.7 --export-release Web             "$PWD/artifacts/godot-web/index.html"
          test -s artifacts/godot-web/index.html
          test -s artifacts/godot-web/index.wasm
          test -s artifacts/godot-web/index.pck
          du -h artifacts/godot-web/* | sort -h
          echo "GODOT_WEB_EXPORT_COMPILED=YES" >> "${GITHUB_STEP_SUMMARY}"
          echo "Renderer: Compatibility / WebGL2, threads disabled, original painted asset only" >> "${GITHUB_STEP_SUMMARY}"
          echo "This export is a rendering experiment, not a finished playable PvP client" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-472-painted-stage-webgl2-render-spike
          path: artifacts/godot-web/
          if-no-files-found: warn
          retention-days: 7
